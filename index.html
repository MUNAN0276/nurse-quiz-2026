<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>护士年度考核 · 练习题库</title><link rel="stylesheet" href="style.css"><header><small>2026 年度考核复习</small><h1>每天练一点，复习更从容</h1><p>1298 道原题 · 原图保留 · 自动记录进度</p></header><main><section id="home"><div id="stats" class="card"></div><div class="grid"><button data-mode="continue">继续上次练习</button><button data-mode="sequence">顺序练习</button><button data-mode="random">随机练习</button><button data-mode="wrong">错题重练</button><button data-mode="star">我的收藏</button></div><div class="card"><label>随机练习题量 <select id="count"><option>10</option><option selected>20</option><option>50</option></select></label><p><input id="number" type="number" min="1" max="1298" placeholder="输入原题号"><button id="jump">前往题目</button></p><button id="export">备份学习记录</button><label class="import">恢复记录<input id="import" type="file" accept="application/json"></label></div><p class="muted">记录保存在当前浏览器，换设备或清理缓存后需导入备份。答案来自原题库，疑问题请与老师核对。</p></section><section id="practice" hidden><div class="toolbar"><button id="back">返回首页</button><span id="position"></span><button id="star">收藏</button></div><article class="card"><div id="case" class="case"></div><p id="meta" class="muted"></p><h2 id="stem"></h2><div id="options"></div><div id="feedback" role="status"></div><button id="submit">提交答案</button></article><div class="toolbar"><button id="prev">上一题</button><button id="next">下一题</button></div><button id="report">复制题目反馈</button></section><p id="notice" role="status"></p></main><script src="bank.js"></script><script src="app.js"></script></html>
